<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>树洞漂流瓶</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="logo-section">
      <div class="logo-icon">🍾</div>
      <div class="logo-title">树洞漂流瓶</div>
      <div class="logo-subtitle">投放你的心声，等待有缘人拾取</div>
    </div>

    <!-- 登录表单 -->
    <div class="login-section" id="loginForm">
      <input type="email" id="emailInput" placeholder="请输入邮箱" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px;box-sizing:border-box;">
      <input type="password" id="passwordInput" placeholder="请输入密码" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:15px;font-size:15px;box-sizing:border-box;">
      <button class="login-btn" id="loginBtn" style="width:100%;max-width:300px;height:48px;background:#fff;color:#4a90d9;font-size:17px;font-weight:bold;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.15);">登录</button>
      <div style="margin-top:20px;color:rgba(255,255,255,0.9);font-size:14px;">
        还没有账号？<a href="#" id="showRegister" style="color:#fff;font-weight:bold;text-decoration:underline;">立即注册</a>
      </div>
    </div>

    <!-- 注册表单 -->
    <div class="login-section" id="registerForm" style="display:none;">
      <input type="text" id="regNickname" placeholder="昵称" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px;box-sizing:border-box;">
      <input type="email" id="regEmail" placeholder="邮箱" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px;box-sizing:border-box;">
      <input type="password" id="regPassword" placeholder="密码（至少6位）" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:15px;box-sizing:border-box;">
      <input type="password" id="regPassword2" placeholder="确认密码" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-bottom:15px;font-size:15px;box-sizing:border-box;">
      <button class="login-btn" id="registerBtn" style="width:100%;max-width:300px;height:48px;background:#fff;color:#4a90d9;font-size:17px;font-weight:bold;border-radius:24px;border:none;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.15);">注册</button>
      <div style="margin-top:20px;color:rgba(255,255,255,0.9);font-size:14px;">
        已有账号？<a href="#" id="showLogin" style="color:#fff;font-weight:bold;text-decoration:underline;">去登录</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    async function callApi(action, data = {}) {
      const res = await fetch(`${API_URL}/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    // 切换表单
    document.getElementById('showRegister').onclick = (e) => {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    };

    document.getElementById('showLogin').onclick = (e) => {
      e.preventDefault();
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    };

    // 登录
    document.getElementById('loginBtn').onclick = async () => {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!email || !password) {
        showToast('请填写完整');
        return;
      }

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const result = await callApi('emailLogin', { email, password });
        if (result.code === 0) {
          localStorage.setItem('userInfo', JSON.stringify(result.data));
          showToast('登录成功');
          setTimeout(() => location.href = '/', 1000);
        } else {
          showToast(result.msg || '登录失败');
        }
      } catch (e) {
        showToast('登录失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    };

    // 注册
    document.getElementById('registerBtn').onclick = async () => {
      const nickname = document.getElementById('regNickname').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;

      if (!nickname || !email || !password) {
        showToast('请填写完整');
        return;
      }
      if (password.length < 6) {
        showToast('密码至少6位');
        return;
      }
      if (password !== password2) {
        showToast('两次密码不一致');
        return;
      }
      if (!email.includes('@')) {
        showToast('邮箱格式不正确');
        return;
      }

      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = '注册中...';

      try {
        const result = await callApi('emailRegister', { nickname, email, password });
        if (result.code === 0) {
          showToast('注册成功，请登录');
          document.getElementById('showLogin').click();
          document.getElementById('emailInput').value = email;
        } else {
          showToast(result.msg || '注册失败');
        }
      } catch (e) {
        showToast('注册失败');
      } finally {
        btn.disabled = false;
        btn.textContent = '注册';
      }
    };

    // 回车键支持
    document.getElementById('passwordInput').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); };
    document.getElementById('regPassword2').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('registerBtn').click(); };

    // 检查是否已登录
    if (localStorage.getItem('userInfo')) {
      location.href = '/';
    }
  </script>
</body>
</html>
