<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>树洞漂流瓶 - 消息</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .chat-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .chat-header h1 { font-size: 18px; margin: 0; }
    .chat-container { min-height: 100vh; background: #f5f5f5; }
    .tab-nav { display: flex; background: #fff; border-bottom: 1px solid #eee; }
    .tab-nav-item { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 14px; color: #666; }
    .tab-nav-item.active { color: #667eea; border-bottom: 2px solid #667eea; font-weight: bold; }
    .tab-content { display: none; padding: 15px; }
    .tab-content.active { display: block; }
    .friend-item, .request-item { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; cursor: pointer; }
    .friend-item:active, .request-item:active { background: #f8f8f8; }
    .friend-avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; margin-right: 12px; }
    .friend-info { flex: 1; }
    .friend-name { font-size: 15px; font-weight: bold; color: #333; }
    .friend-time { font-size: 12px; color: #999; margin-top: 2px; }
    .request-actions { display: flex; gap: 8px; }
    .request-btn { padding: 6px 12px; border-radius: 15px; border: none; font-size: 12px; cursor: pointer; }
    .accept-btn { background: #667eea; color: #fff; }
    .reject-btn { background: #f0f0f0; color: #666; }
    .empty-state { text-align: center; padding: 60px 20px; color: #999; }
    .empty-state .icon { font-size: 50px; margin-bottom: 10px; }
    /* 聊天窗口 */
    .chat-window { display: none; flex-direction: column; height: 100vh; }
    .chat-window.active { display: flex; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 15px; }
    .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .message-mine { background: #667eea; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
    .message-other { background: #fff; color: #333; border-bottom-left-radius: 4px; }
    .message-time { font-size: 11px; color: #999; margin-bottom: 4px; }
    .message-time.mine { text-align: right; }
    .chat-input-bar { display: flex; padding: 10px 15px; background: #fff; border-top: 1px solid #eee; }
    .chat-input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
    .chat-input:focus { border-color: #667eea; }
    .send-btn { padding: 10px 20px; margin-left: 10px; background: #667eea; color: #fff; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; margin-right: 10px; }
    .chat-header-bar { display: flex; align-items: center; }
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; z-index: 9999; }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- 好友列表视图 -->
    <div id="listView">
      <div class="chat-header">
        <h1>💬 消息</h1>
      </div>
      <div class="tab-nav">
        <div class="tab-nav-item active" data-tab="friends">好友</div>
        <div class="tab-nav-item" data-tab="requests">好友请求 <span id="requestBadge" style="background:#f5576c;color:#fff;padding:1px 6px;border-radius:10px;font-size:11px;display:none;">0</span></div>
      </div>

      <!-- 好友列表 -->
      <div class="tab-content active" id="friendsTab">
        <div id="friendsList">
          <div class="empty-state"><div class="icon">👥</div><div>还没有好友</div></div>
        </div>
      </div>

      <!-- 好友请求 -->
      <div class="tab-content" id="requestsTab">
        <div id="requestsList">
          <div class="empty-state"><div class="icon">📬</div><div>暂无好友请求</div></div>
        </div>
      </div>
    </div>

    <!-- 聊天窗口 -->
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">
        <div class="chat-header-bar">
          <button class="back-btn" id="backBtn">←</button>
          <h1 id="chatFriendName">聊天</h1>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" id="chatInput" placeholder="输入消息...">
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';
    let userInfo = null;
    let currentFriend = null;
    let messageTimer = null;

    async function callApi(action, data = {}) {
      const res = await fetch(`${API_URL}/${action}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-user-id': userInfo?.userId || ''
        },
        body: JSON.stringify(data)
      });
      return res.json();
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2000);
    }

    function formatTime(d) {
      if (!d) return '';
      const date = new Date(d);
      const now = new Date();
      const isToday = date.toDateString() === now.toDateString();
      if (isToday) {
        return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
      }
      return `${date.getMonth()+1}/${date.getDate()}`;
    }

    // 初始化
    async function init() {
      const saved = localStorage.getItem('userInfo');
      if (!saved) {
        location.href = '/login.html';
        return;
      }
      userInfo = JSON.parse(saved);

      // Tab切换
      document.querySelectorAll('.tab-nav-item').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('.tab-nav-item').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
        };
      });

      document.getElementById('backBtn').onclick = closeChat;
      document.getElementById('sendBtn').onclick = sendMessage;
      document.getElementById('chatInput').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

      await loadFriends();
      await loadRequests();
    }

    // 加载好友列表
    async function loadFriends() {
      try {
        const result = await callApi('friends', { userId: userInfo.userId });
        const friends = result.data || [];

        if (friends.length === 0) {
          document.getElementById('friendsList').innerHTML = '<div class="empty-state"><div class="icon">👥</div><div>还没有好友<br><small>投放漂流瓶时可以结交好友</small></div></div>';
          return;
        }

        document.getElementById('friendsList').innerHTML = friends.map(f => `
          <div class="friend-item" data-friend-id="${f.friendId}" data-friend-name="${f.nickname}">
            <div class="friend-avatar">${f.nickname[0]}</div>
            <div class="friend-info">
              <div class="friend-name">${f.nickname}</div>
              <div class="friend-time">${f.email ? '📧 ' + f.email + ' · ' : ''}加好友于 ${formatTime(f.createTime)}</div>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.friend-item').forEach(el => {
          el.onclick = () => openChat(el.dataset.friendId, el.dataset.friendName);
        });
      } catch (e) {
        showToast('加载失败');
      }
    }

    // 加载好友请求
    async function loadRequests() {
      try {
        const result = await callApi('friendRequests', { userId: userInfo.userId });
        const requests = result.data || [];

        const badge = document.getElementById('requestBadge');
        if (requests.length > 0) {
          badge.style.display = 'inline';
          badge.textContent = requests.length;
        } else {
          badge.style.display = 'none';
        }

        if (requests.length === 0) {
          document.getElementById('requestsList').innerHTML = '<div class="empty-state"><div class="icon">📬</div><div>暂无好友请求</div></div>';
          return;
        }

        document.getElementById('requestsList').innerHTML = requests.map(r => `
          <div class="request-item">
            <div class="friend-avatar">${r.fromNickname[0]}</div>
            <div class="friend-info">
              <div class="friend-name">${r.fromNickname}</div>
              <div class="friend-time">${r.message}</div>
            </div>
            <div class="request-actions">
              <button class="request-btn accept-btn" data-id="${r.id}">接受</button>
              <button class="request-btn reject-btn" data-id="${r.id}">拒绝</button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.accept-btn').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            await acceptRequest(btn.dataset.id);
          };
        });

        document.querySelectorAll('.reject-btn').forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            await rejectRequest(btn.dataset.id);
          };
        });
      } catch (e) {
        showToast('加载失败');
      }
    }

    // 接受好友请求
    async function acceptRequest(requestId) {
      try {
        const result = await callApi('acceptFriend', { requestId, userId: userInfo.userId });
        if (result.code === 0) {
          showToast('已添加好友');
          await loadFriends();
          await loadRequests();
        } else {
          showToast(result.msg);
        }
      } catch (e) {
        showToast('操作失败');
      }
    }

    // 拒绝好友请求
    async function rejectRequest(requestId) {
      try {
        const result = await callApi('rejectFriend', { requestId, userId: userInfo.userId });
        if (result.code === 0) {
          showToast('已拒绝');
          await loadRequests();
        }
      } catch (e) {
        showToast('操作失败');
      }
    }

    // 打开聊天
    async function openChat(friendId, friendName) {
      currentFriend = { id: friendId, name: friendName };
      document.getElementById('chatFriendName').textContent = friendName;
      document.getElementById('listView').style.display = 'none';
      document.getElementById('chatWindow').classList.add('active');

      // 标记为已读
      await callApi('markRead', { userId: userInfo.userId, friendId });

      await loadMessages();
      // 定时刷新消息
      messageTimer = setInterval(loadMessages, 3000);
    }

    // 关闭聊天
    function closeChat() {
      document.getElementById('chatWindow').classList.remove('active');
      document.getElementById('listView').style.display = 'block';
      currentFriend = null;
      if (messageTimer) {
        clearInterval(messageTimer);
        messageTimer = null;
      }
    }

    // 加载聊天记录
    async function loadMessages() {
      if (!currentFriend) return;
      try {
        const result = await callApi('messages', { userId: userInfo.userId, friendId: currentFriend.id });
        const messages = result.data || [];

        const container = document.getElementById('chatMessages');
        container.innerHTML = messages.map(m => `
          <div class="message-time ${m.isMine ? 'mine' : ''}">${formatTime(m.createTime)}</div>
          <div class="message-bubble ${m.isMine ? 'message-mine' : 'message-other'}">${m.content}</div>
        `).join('');

        container.scrollTop = container.scrollHeight;
      } catch (e) {}
    }

    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content || !currentFriend) return;

      input.value = '';
      try {
        const result = await callApi('sendMessage', {
          fromUserId: userInfo.userId,
          toUserId: currentFriend.id,
          content
        });
        if (result.code === 0) {
          await loadMessages();
        } else {
          showToast(result.msg);
        }
      } catch (e) {
        showToast('发送失败');
      }
    }

    init();
  </script>
</body>
</html>
